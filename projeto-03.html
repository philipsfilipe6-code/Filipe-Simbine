<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimbus Deploy — Estudo de caso</title>
<meta name="description" content="Painel de implantações com cartões de estado a construir/pronto, tema escuro, atualizado em JavaScript.">
<style>
  :root {
    --fundo: #0a0a0c;
    --fundo-cartao: #141417;
    --texto: #ededf0;
    --texto-suave: #8a8a92;
    --borda: #232327;
    --sucesso: #33d17a;
    --construindo: #f5a623;
    --erro: #ff5c5c;
    --destaque: #7c7cff;
    --fonte: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--fonte); background: var(--fundo); color: var(--texto); line-height: 1.5; }
  .container { max-width: 1000px; margin-inline: auto; padding-inline: 1.5rem; }
  a { color: inherit; text-decoration: none; }

  header { border-bottom: 1px solid var(--borda); padding: 1.1rem 0; }
  nav { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
  .logo__ponto { width: 9px; height: 9px; border-radius: 50%; background: var(--destaque); }
  .voltar { font-size: 0.85rem; color: var(--texto-suave); }
  .voltar:hover { color: var(--destaque); }

  .topo-painel { padding: 2.5rem 0 1.5rem; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1rem; }
  .topo-painel h1 { font-size: 1.6rem; letter-spacing: -0.01em; }
  .topo-painel p { color: var(--texto-suave); font-size: 0.9rem; margin-top: 0.3rem; }
  .botao-novo { background: var(--destaque); color: #fff; border: none; padding: 0.6rem 1.1rem; border-radius: 8px; font: inherit; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
  .botao-novo:hover { background: #6a6aff; }

  .lista-projetos { display: grid; gap: 0.9rem; padding-bottom: 3rem; }
  .cartao-projeto {
    background: var(--fundo-cartao);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 1.1rem 1.3rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    transition: border-color 0.2s ease;
  }
  .cartao-projeto:hover { border-color: #3a3a42; }
  .cartao-projeto__info { display: flex; flex-direction: column; gap: 0.2rem; }
  .cartao-projeto__nome { font-weight: 700; }
  .cartao-projeto__meta { font-size: 0.8rem; color: var(--texto-suave); }
  .estado {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 0.3rem 0.7rem; border-radius: 980px;
  }
  .estado__ponto { width: 7px; height: 7px; border-radius: 50%; }
  .estado--pronto { background: rgba(51,209,122,0.12); color: var(--sucesso); }
  .estado--pronto .estado__ponto { background: var(--sucesso); }
  .estado--construindo { background: rgba(245,166,35,0.12); color: var(--construindo); }
  .estado--construindo .estado__ponto { background: var(--construindo); animation: pulsar 1.1s ease-in-out infinite; }
  .estado--erro { background: rgba(255,92,92,0.12); color: var(--erro); }
  .estado--erro .estado__ponto { background: var(--erro); }
  @keyframes pulsar { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  footer { text-align: center; padding: 2.5rem 0; color: var(--texto-suave); font-size: 0.8rem; border-top: 1px solid var(--borda); }

  @media (prefers-reduced-motion: reduce) {
    .estado--construindo .estado__ponto { animation: none; }
  }
</style>
</head>
<body>

<header>
  <nav class="container">
    <span class="logo"><span class="logo__ponto"></span> Nimbus Deploy</span>
    <a class="voltar" href="javascript:window.close() || history.back()">← Voltar ao portfólio</a>
  </nav>
</header>

<main class="container">
  <div class="topo-painel">
    <div>
      <h1>Implantações</h1>
      <p>Estado em tempo simulado dos seus projetos.</p>
    </div>
    <button class="botao-novo" id="botao-implantar">+ Nova implantação</button>
  </div>

  <div class="lista-projetos" id="lista-projetos">
    <!-- Preenchido via JavaScript -->
  </div>
</main>

<footer>
  Projeto de demonstração criado por Milionário — marca e dados fictícios, apenas para fins de portfólio.
</footer>

<script>
(function () {
  'use strict';

  var projetosBase = [
    { nome: 'portfolio-pessoal', meta: 'main · há 2 min', estado: 'pronto' },
    { nome: 'loja-aurora-landing', meta: 'main · há 8 min', estado: 'construindo' },
    { nome: 'painel-sentinela', meta: 'feature/graficos · há 20 min', estado: 'pronto' },
    { nome: 'ondas-music-player', meta: 'main · há 1h', estado: 'erro' },
    { nome: 'cv-online', meta: 'main · há 3h', estado: 'pronto' }
  ];

  var rotulos = { pronto: 'Pronto', construindo: 'A construir', erro: 'Falhou' };
  var lista = document.getElementById('lista-projetos');

  function renderizar() {
    lista.innerHTML = '';
    projetosBase.forEach(function (p) {
      var cartao = document.createElement('div');
      cartao.className = 'cartao-projeto';
      cartao.innerHTML =
        '<div class="cartao-projeto__info">' +
          '<span class="cartao-projeto__nome">' + p.nome + '</span>' +
          '<span class="cartao-projeto__meta">' + p.meta + '</span>' +
        '</div>' +
        '<span class="estado estado--' + p.estado + '"><span class="estado__ponto"></span>' + rotulos[p.estado] + '</span>';
      lista.appendChild(cartao);
    });
  }

  renderizar();

  /* Simula progresso: o projeto "a construir" fica "pronto" depois de um tempo */
  setTimeout(function () {
    var alvo = projetosBase.find(function (p) { return p.estado === 'construindo'; });
    if (alvo) { alvo.estado = 'pronto'; renderizar(); }
  }, 3500);

  document.getElementById('botao-implantar').addEventListener('click', function () {
    projetosBase.unshift({ nome: 'novo-projeto-' + Math.floor(Math.random() * 900 + 100), meta: 'main · agora mesmo', estado: 'construindo' });
    renderizar();
    var novo = projetosBase[0];
    setTimeout(function () { novo.estado = 'pronto'; renderizar(); }, 3000);
  });
})();
</script>

</body>
</html>
