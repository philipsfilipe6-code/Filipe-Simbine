<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Cartão de Crédito Realista</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
    }

    /* Container 3D */
    .card-container {
      perspective: 1000px;
      width: 400px;
      height: 252px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s;
      cursor: pointer;
    }

    .card:hover { transform: rotateY(180deg); }

    /* Frente e verso */
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    }

    /* === FRENTE === */
    .card-front {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    }

    /* Chip EMV dourado */
    .chip {
      position: absolute;
      top: 90px; left: 40px;
      width: 55px; height: 42px;
      background: linear-gradient(135deg, #d4af37, #f4d03f, #b7950b, #f4d03f, #d4af37);
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.3);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* Número do cartão */
    .card-number {
      position: absolute;
      top: 155px; left: 40px; right: 40px;
      font-size: 24px;
      letter-spacing: 4px;
      color: #e2e8f0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Titular */
    .card-holder {
      position: absolute;
      bottom: 35px; left: 40px;
    }
    .label {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.5);
    }
    .holder-name {
      font-size: 15px;
      color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Validade */
    .expiry {
      position: absolute;
      bottom: 35px; left: 200px;
    }
    .expiry-date {
      font-size: 15px;
      color: #e2e8f0;
    }

    /* Logo Mastercard */
    .logo {
      position: absolute;
      bottom: 25px; right: 35px;
      display: flex;
    }
    .logo-circle {
      width: 36px; height: 36px;
      border-radius: 50%;
      opacity: 0.85;
    }
    .logo-red { background: #eb001b; margin-right: -12px; }
    .logo-orange { background: #f79e1b; }

    /* Holograma brilhante */
    .hologram {
      position: absolute;
      top: 35px; right: 35px;
      width: 50px; height: 40px;
      background: linear-gradient(45deg, 
        rgba(255,255,255,0.1), 
        rgba(255,255,255,0.3), 
        rgba(255,255,255,0.1));
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* === VERSO === */
    .card-back {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      transform: rotateY(180deg);
    }

    .magnetic-strip {
      position: absolute;
      top: 30px; left: 0; right: 0;
      height: 50px;
      background: linear-gradient(180deg, #0a0a0a, #1a1a1a, #0a0a0a);
    }

    .signature-panel {
      position: absolute;
      top: 100px; left: 30px;
      width: 240px; height: 40px;
      background: repeating-linear-gradient(
        0deg, #e8e8e8, #e8e8e8 2px, #f0f0f0 2px, #f0f0f0 4px
      );
      border-radius: 4px;
    }

    .cvv {
      position: absolute;
      top: 108px; left: 280px;
      font-size: 14px; color: #1a1a2e;
      background: #e8e8e8;
      padding: 4px 8px;
      border-radius: 3px;
      font-weight: bold;
    }

    .back-text {
      position: absolute;
      bottom: 30px; left: 30px; right: 30px;
      font-size: 7px;
      color: rgba(255,255,255,0.4);
      line-height: 1.6;
      text-align: justify;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="card">
      
      <!-- FRENTE -->
      <div class="card-front">
        <div class="hologram"></div>
        <div class="chip"></div>
        <div class="card-number">4532  8910  2345  6789</div>
        
        <div class="card-holder">
          <div class="label">Titular do Cartão</div>
          <div class="holder-name">Filipe Rodrigues Simbine</div>
        </div>
        
        <div class="expiry">
          <div class="label">Validade</div>
          <div class="expiry-date">12/28</div>
        </div>
        
        <div class="logo">
          <div class="logo-circle logo-red"></div>
          <div class="logo-circle logo-orange"></div>
        </div>
      </div>

      <!-- VERSO -->
      <div class="card-back">
        <div class="magnetic-strip"></div>
        <div class="signature-panel"></div>
        <div class="cvv">433</div>
        <div class="back-text">
          Este cartão é propriedade do banco emissor e deve ser devolvido quando solicitado.
          O uso deste cartão está sujeito ao contrato de adesão.
        </div>
      </div>

    </div>
  </div>

</body>
</html>
